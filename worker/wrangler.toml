# Cloudflare Worker for form submissions and photo uploads. Deployed by
# .github/workflows/worker.yml; see worker/README.md for the one-time setup.
name = "cameron-belcher-intake"
# Cameron's Cloudflare account (not a secret: it only says which account to deploy to).
account_id = "18b40b46e4593f13ace5f65c6c551b99"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Sites allowed to send forms here (the live site and local testing).
[vars]
ALLOWED_ORIGINS = "https://cameron-belcher-web.pages.dev,http://localhost:4321"

# Sends client sites' enquiries (POST /enquiry). Needs Email Routing on a
# domain in this account; MAIL_FROM (an address on it) is set by the deploy.
# The deploy leaves this out until MAIL_FROM is set (see worker/README.md).
# send-email-start
[[send_email]]
name = "MAILER"
# send-email-end

[[r2_buckets]]
binding = "STORE"
bucket_name = "cameron-belcher-intake"

# ADMIN_TOKEN is a secret (set by the deploy workflow), never written here.
