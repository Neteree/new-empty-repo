# Tests the starter and its modules: makes each demo client site and runs the
# full checks on each.
name: Starter

on:
  pull_request:
    paths: ['starter/**', 'modules/**', 'ops/**', 'site_agent.py', '.github/workflows/starter.yml']
  push:
    branches: [main]
    paths: ['starter/**', 'modules/**', 'ops/**', 'site_agent.py', '.github/workflows/starter.yml']

jobs:
  # The queue scripts must describe every change type the site scripts know.
  lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/.node-version
      - run: node ops/check.js
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [example, bakery, florist-demo, trades-demo, minigolf-demo, services-demo, shop-demo, lantern-demo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/.node-version
          cache: npm
          cache-dependency-path: starter/package-lock.json
      - name: Make the example site
        working-directory: starter
        run: |
          node scripts/new-client.js clients/${{ matrix.client }}.json "$RUNNER_TEMP/site"
          cp package-lock.json "$RUNNER_TEMP/site/"
      - name: Check it
        working-directory: ${{ runner.temp }}/site
        run: |
          # install, not ci: a module can add packages (module.json) that the starter's lock file doesn't list
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.client }}
          path: ${{ runner.temp }}/site/check-output/
