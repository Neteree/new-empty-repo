# The Cloudflare intake Worker (worker/): tests it on every pull request that
# touches it, and deploys it from main once the Cloudflare secrets are set up
# (see worker/README.md). Until then the deploy step says so and stops.
name: Intake worker

on:
  pull_request:
    paths: ['worker/**', '.github/workflows/worker.yml']
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Run it locally and test it
        run: |
          echo "ADMIN_TOKEN=local-test-token" > .dev.vars
          npx wrangler dev --local --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8787/ && break; sleep 1; done
          node test.mjs || { cat wrangler.log; exit 1; }

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.INTAKE_ADMIN_TOKEN }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare secrets are set up
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "Not set up yet: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and INTAKE_ADMIN_TOKEN (see worker/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - if: steps.ready.outputs.ready == 'true'
        run: npm ci
      - name: Make sure the storage bucket exists
        if: steps.ready.outputs.ready == 'true'
        run: npx wrangler r2 bucket create cameron-belcher-intake || echo "The bucket is already there."
      - name: Deploy
        if: steps.ready.outputs.ready == 'true'
        run: |
          npx wrangler deploy
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
